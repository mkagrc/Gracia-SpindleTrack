spring.application.name=spindletrack-api
server.port=${SERVER_PORT:8080}

# Optional local .env file; environment variables take precedence.
spring.config.import=optional:file:.env[.properties]
spindletrack.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
spindletrack.firebase.database-url=${FIREBASE_DATABASE_URL:}
spindletrack.auth.admin-email=${ADMIN_EMAIL:}
spindletrack.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
spindletrack.files.storage-path=${FILE_STORAGE_PATH:}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.return-url=${PAYPAL_RETURN_URL:${FRONTEND_BASE_URL:http://localhost:5173}/paypal/return}
paypal.cancel-url=${PAYPAL_CANCEL_URL:${FRONTEND_BASE_URL:http://localhost:5173}/paypal/cancel}
spindletrack.proxy.trusted-cidrs=${TRUSTED_PROXY_CIDRS:}
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:SpindleTrack}
spindletrack.notifications.poll-ms=${NOTIFICATION_POLL_MS:60000}
spindletrack.unclaimed.cron=${UNCLAIMED_SCAN_CRON:0 10 0 * * *}
spindletrack.shops.nearby-radius-km=${NEARBY_RADIUS_KM:15.0}
spindletrack.nominatim.user-agent=${NOMINATIM_USER_AGENT:SpindleTrack/1.0 (contact: admin@spindletrack.app)}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# Avoid exposing exception details in HTTP responses.
server.error.include-message=never
