spring.application.name=spindletrack-api
server.port=${SERVER_PORT:8080}

# Optional local .env file; environment variables take precedence.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spindletrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:spindletrack}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spindletrack.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
spindletrack.auth.admin-email=${ADMIN_EMAIL:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Avoid exposing exception details in HTTP responses.
server.error.include-message=never
